services:
  chorecast:
    image: ghcr.io/voidrot/chorecast:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - chorecast-data:/data
    environment:
      TZ: America/New_York
      # How browsers and the app reach the server; used in printed links (setup URL, pairing QR).
      # CHORECAST_PUBLIC_URL: https://chores.example.com
      # Optional SSO for parent accounts:
      # CHORECAST_OIDC_ISSUER: https://auth.example.com/application/o/chorecast/
      # CHORECAST_OIDC_CLIENT_ID: chorecast
      # CHORECAST_OIDC_CLIENT_SECRET: change-me
      # Largest accepted photo upload in MB (default 15):
      # CHORECAST_MEDIA_MAX_PHOTO_MB: 15
      # Daily backups to /data/backups, this long after the household day end, keeping the
      # newest few (defaults 1h and 7). Restore with the server stopped:
      #   docker compose run --rm chorecast restore /data/backups/chorecast-<time>.tar.gz
      # CHORECAST_BACKUP_AFTER_DAY_END: 1h
      # CHORECAST_BACKUP_KEEP: 7
      # Memory: processing one photo peaks at about 210 MB (photos are processed one at a time).
      # With a container memory limit, set GOMEMLIMIT a little below it so the Go runtime frees
      # memory before the limit is hit, e.g. mem_limit: 512m with:
      # GOMEMLIMIT: 400MiB

volumes:
  chorecast-data:
