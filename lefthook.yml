pre-commit:
  parallel: true
  commands:
    go-fmt:
      glob: "server/**/*.go"
      run: |
        unformatted=$(gofmt -l {staged_files})
        [ -z "$unformatted" ] || { echo "gofmt needed (mise run fmt):"; echo "$unformatted"; exit 1; }
    go-lint:
      glob: "server/**/*.go"
      root: "server/"
      run: golangci-lint run --new-from-rev=HEAD ./...
    web-biome:
      glob: "web/**/*.{ts,js,vue,json,html,css}"
      root: "web/"
      run: pnpm exec biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}

commit-msg:
  commands:
    conventional:
      run: |
        head -1 {1} | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+' \
          || { echo "Commit message must follow Conventional Commits, e.g. 'feat(server): add chores API'"; exit 1; }
