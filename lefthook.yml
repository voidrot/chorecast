pre-commit:
  parallel: true
  commands:
    go-fmt:
      glob: "server/**/*.go"
      run: gofmt -l {staged_files} | (! grep .) || (echo "run: mise run fmt" && exit 1)
    go-lint:
      glob: "server/**/*.go"
      root: "server/"
      run: golangci-lint run --new-from-rev=HEAD ./...
    web-lint:
      glob: "web/**/*.{ts,vue}"
      root: "web/"
      run: pnpm exec eslint {staged_files}

commit-msg:
  commands:
    conventional:
      run: |
        head -1 {1} | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+' \
          || { echo "Commit message must follow Conventional Commits, e.g. 'feat(server): add chores API'"; exit 1; }
