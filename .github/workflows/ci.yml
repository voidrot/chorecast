name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs only; every main commit gets a full result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# release-please PRs change only versions and changelogs (release-please--* branches). They skip
# server-web and image; the android release PR runs just the release build, which evaluates
# versionCodeFor(versionName) and R8.
env:
  RELEASE_PR: ${{ startsWith(github.head_ref, 'release-please--') }}

jobs:
  server-web:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run setup
      - run: mise run gen
      - name: Generated code is up to date
        # status (not diff) so new, uncommitted generated files fail too. The Kotlin client is
        # generated at build time from api/openapi-3.0.json, so the spec check covers it.
        run: |
          paths="server/internal/db/sqlc api/openapi.json api/openapi-3.0.json web/src/api/schema.d.ts"
          if [ -n "$(git status --porcelain -- $paths)" ]; then
            git status --porcelain -- $paths
            git diff -- $paths
            echo "::error::Generated code is stale: run 'mise run gen' and commit the result"
            exit 1
          fi
      - run: mise run ci
      - name: Server tests with the race detector
        working-directory: server
        run: mise exec -- go test -race ./...

  android:
    if: >-
      !startsWith(github.head_ref, 'release-please--') ||
      github.head_ref == 'release-please--branches--main--components--android'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager 'platform-tools' 'platforms;android-37.2' 'build-tools;37.0.0'
      - if: env.RELEASE_PR != 'true'
        run: mise run lint:android
      - if: env.RELEASE_PR != 'true'
        run: mise run test:android
      - if: env.RELEASE_PR != 'true'
        run: mise run build:android
      - name: Release build (unsigned; catches R8/minification problems)
        run: mise run build:android:release
      - name: Upload debug APKs
        if: env.RELEASE_PR != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: chorecast-debug-apks
          path: android/app/build/outputs/apk/*/debug/*.apk
          retention-days: 14

  image:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [runtime, media]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  # The one CI check the main ruleset requires. Matrix and skipped jobs report under different
  # names (release PRs skip image and server-web), so the ruleset requires this instead: it fails
  # if any job failed or was cancelled, and passes when they succeeded or were skipped.
  ci-passed:
    if: always()
    needs: [server-web, android, image]
    runs-on: ubuntu-latest
    steps:
      - name: All CI jobs passed or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
