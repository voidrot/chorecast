name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Never cancel: an interrupted run can leave a release half-created.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.rp.outputs['server--release_created'] }}
      server_version: ${{ steps.rp.outputs['server--version'] }}
      server_tag: ${{ steps.rp.outputs['server--tag_name'] }}
      android: ${{ steps.rp.outputs['android--release_created'] }}
      android_tag: ${{ steps.rp.outputs['android--tag_name'] }}
      android_version: ${{ steps.rp.outputs['android--version'] }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          # A PAT or GitHub App token, so CI runs on release PRs (PRs opened with
          # GITHUB_TOKEN don't trigger workflows). Falls back until the secret exists.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  server-image:
    needs: release-please
    if: needs.release-please.outputs.server == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - target: runtime
            suffix: ""
          - target: media
            suffix: "-media"
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.server_version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.server_version }}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.release-please.outputs.server_version }}
            COMMIT=${{ github.sha }}

  android-apk:
    needs: release-please
    if: needs.release-please.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager 'platform-tools' 'platforms;android-37.2' 'build-tools;37.0.0'
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set; see docs/releasing.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "CHORECAST_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build signed release
        working-directory: android
        env:
          CHORECAST_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CHORECAST_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CHORECAST_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundlePlayRelease
      - name: Verify signatures and name APKs
        env:
          VERSION: ${{ needs.release-please.outputs.android_version }}
        run: |
          apksigner="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          mkdir -p dist
          for apk in android/app/build/outputs/apk/*/release/*.apk; do
            "$apksigner" verify --print-certs "$apk"
            flavor=$(basename "$(dirname "$(dirname "$apk")")")
            cp "$apk" "dist/chorecast-${flavor}-${VERSION}.apk"
          done
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ needs.release-please.outputs.android_tag }} dist/*.apk
