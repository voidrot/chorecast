name: PR title

# Squash merges use the PR title as the commit on main, and release-please reads that commit,
# so the title must be a Conventional Commit. Same rules as the lefthook commit-msg hook.
on:
  # pull_request_target so it also works for fork PRs; it never checks out PR code.
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          scopes: ""
          requireScope: false
          validateSingleCommit: false
          headerPattern: '^(\w+)(?:\(([a-z0-9-]+)\))?!?: (.+)$'
          headerPatternCorrespondence: type, scope, subject
