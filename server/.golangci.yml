version: "2"
linters:
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    paths:
      - internal/db/sqlc
formatters:
  enable:
    - gofmt
    - goimports
